<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PrimeEarth AI Assistant</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  background: linear-gradient(135deg, #0b0f14 0%, #1a1f2e 100%);
  color: #39ff14; 
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.header {
  background: rgba(57, 255, 20, 0.1);
  padding: 15px 20px;
  border-bottom: 2px solid #39ff14;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.header h1 {
  font-size: 1.5em;
  text-shadow: 0 0 10px #39ff14;
}
.status-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.9em;
}
.status-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #39ff14;
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.chat-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}
.message {
  max-width: 80%;
  padding: 12px 18px;
  border-radius: 18px;
  animation: slideIn 0.3s ease-out;
  word-wrap: break-word;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.message.user {
  align-self: flex-end;
  background: #39ff14;
  color: #0b0f14;
  border-bottom-right-radius: 4px;
}
.message.ai {
  align-self: flex-start;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid #39ff14;
  border-bottom-left-radius: 4px;
}
.message.system {
  align-self: center;
  background: rgba(57, 255, 20, 0.2);
  font-size: 0.9em;
  text-align: center;
}
.input-container {
  background: rgba(0, 0, 0, 0.3);
  padding: 15px;
  border-top: 2px solid #39ff14;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-shrink: 0;
}
.input-container input {
  flex: 1;
  padding: 12px 18px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid #39ff14;
  border-radius: 25px;
  color: #39ff14;
  font-size: 1em;
  outline: none;
}
.input-container input:focus {
  background: rgba(57, 255, 20, 0.1);
}
.btn {
  padding: 12px 20px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  font-size: 1em;
  font-weight: bold;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 50px;
}
.btn:hover {
  transform: scale(1.05);
}
.btn-send {
  background: #39ff14;
  color: #0b0f14;
}
.btn-mic {
  background: #e74c3c;
  color: white;
  position: relative;
}
.btn-mic.recording {
  animation: recording 1s infinite;
}
@keyframes recording {
  0%, 100% { background: #e74c3c; }
  50% { background: #c0392b; }
}
.btn-settings {
  background: #3498db;
  color: white;
}
.settings-panel {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 400px;
  height: 100%;
  background: #0b0f14;
  border-left: 2px solid #39ff14;
  padding: 20px;
  overflow-y: auto;
  transition: right 0.3s;
  z-index: 1000;
}
.settings-panel.open {
  right: 0;
}
.settings-panel h2 {
  margin-bottom: 20px;
  padding-bottom: 10px;
  border-bottom: 1px solid #39ff14;
}
.setting-group {
  margin-bottom: 20px;
}
.setting-group label {
  display: block;
  margin-bottom: 8px;
  font-weight: bold;
}
.setting-group input, .setting-group select {
  width: 100%;
  padding: 10px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid #39ff14;
  border-radius: 5px;
  color: #39ff14;
  font-size: 1em;
}
.setting-group button {
  width: 100%;
  padding: 12px;
  background: #39ff14;
  color: #0b0f14;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  margin-top: 10px;
}
.close-settings {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #e74c3c;
  color: white;
  border: none;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  cursor: pointer;
  font-size: 1.2em;
}
.typing-indicator {
  display: flex;
  gap: 5px;
  padding: 15px;
  align-self: flex-start;
}
.typing-indicator span {
  width: 8px;
  height: 8px;
  background: #39ff14;
  border-radius: 50%;
  animation: typing 1.4s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
@keyframes typing {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-10px); }
}
@media (max-width: 600px) {
  .header h1 { font-size: 1.2em; }
  .message { max-width: 90%; }
}
</style>
</head>
<body>
<div class="header">
  <h1>🌍 PrimeEarth AI</h1>
  <div class="status-indicator">
    <div class="status-dot"></div>
    <span id="connectionStatus">Online</span>
  </div>
</div>

<div class="chat-container" id="chatContainer">
  <div class="message system">
    Selamat datang di PrimeEarth AI Assistant! 🌍<br>
    Ketik pesan atau tekan tombol mikrofon untuk bicara.
  </div>
</div>

<div class="input-container">
  <button class="btn btn-mic" id="micBtn" onclick="toggleVoice()">🎤</button>
  <input type="text" id="userInput" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
  <button class="btn btn-send" onclick="sendMessage()">➤</button>
  <button class="btn btn-settings" onclick="toggleSettings()">⚙️</button>
</div>

<div class="settings-panel" id="settingsPanel">
  <button class="close-settings" onclick="toggleSettings()">✕</button>
  <h2>⚙️ Pengaturan</h2>
  
  <div class="setting-group">
    <label>AI Provider</label>
    <select id="aiProvider" onchange="updateProvider()">
      <option value="local">Local (Ollama)</option>
      <option value="openai">OpenAI (GPT)</option>
      <option value="anthropic">Anthropic (Claude)</option>
      <option value="custom">Custom API</option>
    </select>
  </div>

  <div class="setting-group" id="apiUrlGroup">
    <label>API URL</label>
    <input type="text" id="apiUrl" placeholder="http://localhost:11434/api/generate">
  </div>

  <div class="setting-group" id="apiKeyGroup" style="display:none;">
    <label>API Key</label>
    <input type="password" id="apiKey" placeholder="sk-...">
  </div>

  <div class="setting-group">
    <label>Model</label>
    <input type="text" id="modelName" placeholder="llama2 / gpt-4 / claude-3">
  </div>

  <div class="setting-group">
    <label>Voice Input</label>
    <select id="voiceInput">
      <option value="id-ID">Bahasa Indonesia</option>
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
    </select>
  </div>

  <div class="setting-group">
    <label>Voice Output</label>
    <select id="voiceOutput">
      <option value="id-ID">Bahasa Indonesia</option>
      <option value="en-US">English (US)</option>
      <option value="en-GB">English (UK)</option>
    </select>
  </div>

  <div class="setting-group">
    <label>Auto-Speak Response</label>
    <select id="autoSpeak">
      <option value="true">Ya</option>
      <option value="false">Tidak</option>
    </select>
  </div>

  <div class="setting-group">
    <label>Server URL (untuk kontrol)</label>
    <input type="text" id="serverUrl" placeholder="https://defend-nato-dip-incorporate.trycloudflare.com">
  </div>

  <div class="setting-group">
    <label>API Key Server</label>
    <input type="text" id="serverKey" placeholder="0s3iauyс37io89pU5Vs4yctQ">
  </div>

  <button onclick="saveSettings()">💾 Simpan Pengaturan</button>
  <button onclick="loadFromGitHub()" style="background:#3498db;">🔄 Muat dari GitHub</button>
  <button onclick="clearChat()" style="background:#e74c3c;">🗑️ Hapus Chat</button>
</div>

<script>
const GITHUB_ADDRESSES = "https://raw.githubusercontent.com/PrimeEarth/primeearth/main/addresses.json";
let chatHistory = [];
let recognition = null;
let isRecording = false;
let currentSettings = {};

// Initialize Speech Recognition
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'id-ID';
  
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    document.getElementById('userInput').value = transcript;
    sendMessage();
  };
  
  recognition.onerror = (event) => {
    addMessage('system', 'Error voice: ' + event.error);
    stopRecording();
  };
  
  recognition.onend = () => {
    stopRecording();
  };
}

function loadSettings() {
  const saved = localStorage.getItem('pe_ai_settings');
  if (saved) {
    currentSettings = JSON.parse(saved);
    document.getElementById('aiProvider').value = currentSettings.aiProvider || 'local';
    document.getElementById('apiUrl').value = currentSettings.apiUrl || '';
    document.getElementById('apiKey').value = currentSettings.apiKey || '';
    document.getElementById('modelName').value = currentSettings.modelName || '';
    document.getElementById('voiceInput').value = currentSettings.voiceInput || 'id-ID';
    document.getElementById('voiceOutput').value = currentSettings.voiceOutput || 'id-ID';
    document.getElementById('autoSpeak').value = currentSettings.autoSpeak || 'true';
    document.getElementById('serverUrl').value = currentSettings.serverUrl || '';
    document.getElementById('serverKey').value = currentSettings.serverKey || '';
    updateProvider();
  }
  
  const savedChat = localStorage.getItem('pe_chat_history');
  if (savedChat) {
    chatHistory = JSON.parse(savedChat);
    chatHistory.forEach(msg => {
      if (msg.role !== 'system') {
        addMessage(msg.role, msg.content, false);
      }
    });
  }
}

function saveSettings() {
  currentSettings = {
    aiProvider: document.getElementById('aiProvider').value,
    apiUrl: document.getElementById('apiUrl').value,
    apiKey: document.getElementById('apiKey').value,
    modelName: document.getElementById('modelName').value,
    voiceInput: document.getElementById('voiceInput').value,
    voiceOutput: document.getElementById('voiceOutput').value,
    autoSpeak: document.getElementById('autoSpeak').value,
    serverUrl: document.getElementById('serverUrl').value,
    serverKey: document.getElementById('serverKey').value
  };
  localStorage.setItem('pe_ai_settings', JSON.stringify(currentSettings));
  addMessage('system', '✅ Pengaturan disimpan!');
  toggleSettings();
}

function updateProvider() {
  const provider = document.getElementById('aiProvider').value;
  const apiKeyGroup = document.getElementById('apiKeyGroup');
  const apiUrlGroup = document.getElementById('apiUrlGroup');
  
  if (provider === 'openai' || provider === 'anthropic') {
    apiKeyGroup.style.display = 'block';
    apiUrlGroup.style.display = provider === 'openai' ? 'block' : 'none';
  } else {
    apiKeyGroup.style.display = 'none';
    apiUrlGroup.style.display = 'block';
  }
}

function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  panel.classList.toggle('open');
}

function toggleVoice() {
  if (!recognition) {
    addMessage('system', '❌ Browser tidak mendukung voice input. Gunakan Chrome/Edge.');
    return;
  }
  
  if (isRecording) {
    recognition.stop();
    stopRecording();
  } else {
    recognition.lang = document.getElementById('voiceInput').value;
    recognition.start();
    startRecording();
  }
}

function startRecording() {
  isRecording = true;
  const micBtn = document.getElementById('micBtn');
  micBtn.classList.add('recording');
  micBtn.textContent = '⏹️';
  addMessage('system', '🎤 Mendengarkan...');
}

function stopRecording() {
  isRecording = false;
  const micBtn = document.getElementById('micBtn');
  micBtn.classList.remove('recording');
  micBtn.textContent = '🎤';
}

function handleKeyPress(event) {
  if (event.key === 'Enter') {
    sendMessage();
  }
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const message = input.value.trim();
  if (!message) return;
  
  addMessage('user', message);
  input.value = '';
  
  chatHistory.push({ role: 'user', content: message });
  saveChatHistory();
  
  showTyping();
  
  try {
    const response = await callAI(message);
    removeTyping();
    addMessage('ai', response);
    chatHistory.push({ role: 'ai', content: response });
    saveChatHistory();
    
    if (document.getElementById('autoSpeak').value === 'true') {
      speak(response);
    }
  } catch (error) {
    removeTyping();
    addMessage('system', '❌ Error: ' + error.message);
  }
}

async function callAI(message) {
  const provider = currentSettings.aiProvider || 'local';
  const apiUrl = currentSettings.apiUrl;
  const apiKey = currentSettings.apiKey;
  const model = currentSettings.modelName;
  
  if (provider === 'local') {
    const response = await fetch(apiUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: model || 'llama2',
        prompt: message,
        stream: false
      })
    });
    const data = await response.json();
    return data.response || 'Tidak ada response';
  } else if (provider === 'openai') {
    const response = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + apiKey
      },
      body: JSON.stringify({
        model: model || 'gpt-4',
        messages: chatHistory.map(m => ({ role: m.role === 'ai' ? 'assistant' : m.role, content: m.content }))
      })
    });
    const data = await response.json();
    return data.choices[0].message.content;
  } else if (provider === 'anthropic') {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: model || 'claude-3-sonnet-20240229',
        max_tokens: 1024,
        messages: chatHistory.map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.content }))
      })
    });
    const data = await response.json();
    return data.content[0].text;
  } else {
    return 'Provider tidak didukung';
  }
}

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = document.getElementById('voiceOutput').value;
    utterance.rate = 1;
    utterance.pitch = 1;
    window.speechSynthesis.speak(utterance);
  }
}

function addMessage(role, content, save = true) {
  const container = document.getElementById('chatContainer');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.textContent = content;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function showTyping() {
  const container = document.getElementById('chatContainer');
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const indicator = document.getElementById('typingIndicator');
  if (indicator) indicator.remove();
}

function saveChatHistory() {
  localStorage.setItem('pe_chat_history', JSON.stringify(chatHistory.slice(-50)));
}

function clearChat() {
  chatHistory = [];
  localStorage.removeItem('pe_chat_history');
  document.getElementById('chatContainer').innerHTML = '';
  addMessage('system', 'Chat dihapus. Mulai percakapan baru!');
  toggleSettings();
}

async function loadFromGitHub() {
  try {
    const response = await fetch(GITHUB_ADDRESSES + '?t=' + Date.now());
    if (response.ok) {
      const data = await response.json();
      if (data.nodes && data.nodes.length > 0) {
        const node = data.nodes[0];
        document.getElementById('serverUrl').value = node.url;
        addMessage('system', '✅ Alamat server dimuat dari GitHub');
      }
    }
  } catch (e) {
    addMessage('system', '❌ Gagal memuat dari GitHub');
  }
}

loadSettings();
</script>
</body>
</html>
