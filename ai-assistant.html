<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>PrimeEarth AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#0b0f14;color:#39ff14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh}
.header{background:linear-gradient(135deg,#0d1a0d,#1a2f1a);padding:12px 16px;border-bottom:2px solid #39ff14;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;min-height:56px}
.header h1{font-size:clamp(16px,4vw,22px);text-shadow:0 0 8px #39ff14;display:flex;align-items:center;gap:8px}
.status-indicator{display:flex;align-items:center;gap:6px;font-size:clamp(11px,3vw,14px);background:rgba(57,255,20,.15);padding:4px 10px;border-radius:12px}
.status-dot{width:8px;height:8px;border-radius:50%;background:#39ff14;box-shadow:0 0 6px #39ff14;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.chat-container{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch;min-height:0}
.message{max-width:85%;padding:10px 14px;border-radius:16px;font-size:clamp(13px,3.5vw,15px);line-height:1.4;word-wrap:break-word;animation:slideIn .25s ease-out}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message.user{align-self:flex-end;background:linear-gradient(135deg,#39ff14,#2ecc71);color:#0b0f14;border-bottom-right-radius:4px;font-weight:500}
.message.ai{align-self:flex-start;background:rgba(57,255,20,.08);border:1px solid rgba(57,255,20,.3);border-bottom-left-radius:4px}
.message.system{align-self:center;background:rgba(52,152,219,.15);border:1px solid rgba(52,152,219,.4);font-size:clamp(11px,3vw,13px);text-align:center;max-width:95%;padding:8px 12px}
.input-container{background:linear-gradient(135deg,#0d1a0d,#1a2f1a);padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));border-top:2px solid #39ff14;display:flex;gap:8px;align-items:center;flex-shrink:0;min-height:60px}
.input-container input{flex:1;padding:10px 14px;background:rgba(255,255,255,.08);border:1px solid rgba(57,255,20,.4);border-radius:20px;color:#39ff14;font-size:clamp(13px,3.5vw,15px);outline:none;min-width:0}
.input-container input:focus{background:rgba(57,255,20,.1);border-color:#39ff14}
.input-container input::placeholder{color:rgba(57,255,20,.4)}
.btn{padding:10px 14px;border:none;border-radius:50%;cursor:pointer;font-size:clamp(16px,4vw,20px);transition:all .2s;display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0}
.btn:active{transform:scale(.92)}
.btn-send{background:#39ff14;color:#0b0f14}
.btn-mic{background:#e74c3c;color:#fff}
.btn-mic.recording{animation:recording 1s infinite;box-shadow:0 0 12px #e74c3c}
@keyframes recording{0%,100%{background:#e74c3c}50%{background:#ff6b6b}}
.btn-settings{background:#3498db;color:#fff}
.settings-panel{position:fixed;top:0;right:-100%;width:100%;max-width:380px;height:100%;background:#0b0f14;border-left:2px solid #39ff14;padding:16px;overflow-y:auto;transition:right .3s;z-index:1000}
.settings-panel.open{right:0}
.settings-panel h2{margin-bottom:16px;font-size:18px;padding-bottom:10px;border-bottom:1px solid #39ff14}
.setting-group{margin-bottom:14px}
.setting-group label{display:block;margin-bottom:6px;font-size:13px;font-weight:600}
.setting-group input,.setting-group select{width:100%;padding:10px;background:rgba(255,255,255,.08);border:1px solid rgba(57,255,20,.4);border-radius:8px;color:#39ff14;font-size:14px}
.setting-group button{width:100%;padding:12px;background:#39ff14;color:#0b0f14;border:none;border-radius:8px;cursor:pointer;font-weight:600;margin-top:8px;font-size:14px}
.close-settings{position:absolute;top:12px;right:12px;background:#e74c3c;color:#fff;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
.typing-indicator{display:flex;gap:4px;padding:12px;align-self:flex-start}
.typing-indicator span{width:7px;height:7px;background:#39ff14;border-radius:50%;animation:typing 1.4s infinite}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typing{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:999;display:none}
.overlay.show{display:block}
@media(max-width:280px){.header{padding:8px 10px;min-height:44px}.header h1{font-size:14px}.input-container{padding:6px 8px;min-height:48px}.btn{width:36px;height:36px;font-size:14px}.message{max-width:92%;padding:8px 10px;font-size:12px}}
@media(min-width:768px){body{max-width:900px;margin:0 auto;border-left:1px solid #39ff14;border-right:1px solid #39ff14}.message{max-width:70%}}
@media(max-height:500px) and (orientation:landscape){.header{padding:6px 12px;min-height:40px}.header h1{font-size:16px}.input-container{padding:6px 10px;min-height:48px}.message{max-width:75%;padding:8px 12px;font-size:13px}}
</style>
</head>
<body>
<div class="header"><h1>🌍 PrimeEarth AI</h1><div class="status-indicator"><div class="status-dot"></div><span id="connectionStatus">Online</span></div></div>
<div class="chat-container" id="chatContainer"><div class="message system">Selamat datang di PrimeEarth AI! 🌍<br>Ketik pesan atau tekan 🎤 untuk bicara.</div></div>
<div class="input-container">
<button class="btn btn-mic" id="micBtn" onclick="toggleVoice()">🎤</button>
<input type="text" id="userInput" placeholder="Ketik pesan..." onkeypress="handleKeyPress(event)">
<button class="btn btn-send" onclick="sendMessage()">➤</button>
<button class="btn btn-settings" onclick="toggleSettings()">⚙️</button>
</div>
<div class="overlay" id="overlay" onclick="toggleSettings()"></div>
<div class="settings-panel" id="settingsPanel">
<button class="close-settings" onclick="toggleSettings()">✕</button>
<h2>⚙️ Pengaturan</h2>
<div class="setting-group"><label>AI Provider</label><select id="aiProvider" onchange="updateProvider()"><option value="local">Local (Ollama)</option><option value="openai">OpenAI (GPT)</option><option value="anthropic">Anthropic (Claude)</option><option value="custom">Custom API</option></select></div>
<div class="setting-group" id="apiUrlGroup"><label>API URL</label><input type="text" id="apiUrl" placeholder="http://localhost:11434/api/generate"></div>
<div class="setting-group" id="apiKeyGroup" style="display:none"><label>API Key</label><input type="password" id="apiKey" placeholder="sk-..."></div>
<div class="setting-group"><label>Model</label><input type="text" id="modelName" placeholder="llama2 / gpt-4 / claude-3"></div>
<div class="setting-group"><label>Bahasa Input (Voice)</label><select id="voiceInput"><option value="id-ID">Indonesia</option><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option></select></div>
<div class="setting-group"><label>Bahasa Output (Suara)</label><select id="voiceOutput"><option value="id-ID">Indonesia</option><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option></select></div>
<div class="setting-group"><label>Auto Bicara (TTS)</label><select id="autoSpeak"><option value="true">Ya</option><option value="false">Tidak</option></select></div>
<button onclick="saveSettings()">💾 Simpan Pengaturan</button>
<button onclick="clearChat()" style="background:#e74c3c;color:#fff">🗑️ Hapus Chat</button>
</div>
<script>
let chatHistory=[],recognition=null,isRecording=false,currentSettings={};
if('webkitSpeechRecognition'in window||'SpeechRecognition'in window){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new SR();recognition.continuous=false;recognition.interimResults=false;recognition.lang='id-ID';recognition.onresult=e=>{document.getElementById('userInput').value=e.results[0][0].transcript;sendMessage()};recognition.onerror=e=>{addMessage('system','❌ Voice error: '+e.error);stopRecording()};recognition.onend=()=>stopRecording()}
function loadSettings(){const s=localStorage.getItem('pe_ai_settings');if(s){currentSettings=JSON.parse(s);document.getElementById('aiProvider').value=currentSettings.aiProvider||'local';document.getElementById('apiUrl').value=currentSettings.apiUrl||'';document.getElementById('apiKey').value=currentSettings.apiKey||'';document.getElementById('modelName').value=currentSettings.modelName||'';document.getElementById('voiceInput').value=currentSettings.voiceInput||'id-ID';document.getElementById('voiceOutput').value=currentSettings.voiceOutput||'id-ID';document.getElementById('autoSpeak').value=currentSettings.autoSpeak||'true';updateProvider()}const c=localStorage.getItem('pe_chat_history');if(c){chatHistory=JSON.parse(c);chatHistory.forEach(m=>{if(m.role!=='system')addMessage(m.role,m.content,false)})}}
function saveSettings(){currentSettings={aiProvider:document.getElementById('aiProvider').value,apiUrl:document.getElementById('apiUrl').value,apiKey:document.getElementById('apiKey').value,modelName:document.getElementById('modelName').value,voiceInput:document.getElementById('voiceInput').value,voiceOutput:document.getElementById('voiceOutput').value,autoSpeak:document.getElementById('autoSpeak').value};localStorage.setItem('pe_ai_settings',JSON.stringify(currentSettings));addMessage('system','✅ Pengaturan disimpan!');toggleSettings()}
function updateProvider(){const p=document.getElementById('aiProvider').value;document.getElementById('apiKeyGroup').style.display=(p==='openai'||p==='anthropic')?'block':'none'}
function toggleSettings(){document.getElementById('settingsPanel').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
function toggleVoice(){if(!recognition){addMessage('system','❌ Browser tidak support voice. Pakai Chrome.');return}if(isRecording){recognition.stop();stopRecording()}else{recognition.lang=document.getElementById('voiceInput').value;recognition.start();startRecording()}}
function startRecording(){isRecording=true;const b=document.getElementById('micBtn');b.classList.add('recording');b.textContent='⏹';addMessage('system','🎤 Mendengarkan...')}
function stopRecording(){isRecording=false;const b=document.getElementById('micBtn');b.classList.remove('recording');b.textContent='🎤'}
function handleKeyPress(e){if(e.key==='Enter')sendMessage()}
async function sendMessage(){const input=document.getElementById('userInput');const msg=input.value.trim();if(!msg)return;addMessage('user',msg);input.value='';chatHistory.push({role:'user',content:msg});saveChatHistory();showTyping();try{const r=await callAI(msg);removeTyping();addMessage('ai',r);chatHistory.push({role:'ai',content:r});saveChatHistory();if(document.getElementById('autoSpeak').value==='true')speak(r)}catch(e){removeTyping();addMessage('system','❌ Error: '+e.message)}}
async function callAI(msg){const p=currentSettings.aiProvider||'local',url=currentSettings.apiUrl,key=currentSettings.apiKey,model=currentSettings.modelName;if(p==='local'){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:model||'llama2',prompt:msg,stream:false})});const d=await r.json();return d.response||'Tidak ada response'}else if(p==='openai'){const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:model||'gpt-4',messages:chatHistory.map(m=>({role:m.role==='ai'?'assistant':'user',content:m.content}))})});const d=await r.json();return d.choices[0].message.content}else if(p==='anthropic'){const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:model||'claude-3-sonnet-20240229',max_tokens:1024,messages:chatHistory.map(m=>({role:m.role==='ai'?'assistant':'user',content:m.content}))})});const d=await r.json();return d.content[0].text}return'Provider tidak didukung'}
function speak(text){if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=document.getElementById('voiceOutput').value;window.speechSynthesis.speak(u)}}
function addMessage(role,content,save=true){const c=document.getElementById('chatContainer'),d=document.createElement('div');d.className='message '+role;d.textContent=content;c.appendChild(d);c.scrollTop=c.scrollHeight}
function showTyping(){const c=document.getElementById('chatContainer'),d=document.createElement('div');d.className='typing-indicator';d.id='typingIndicator';d.innerHTML='<span></span><span></span><span></span>';c.appendChild(d);c.scrollTop=c.scrollHeight}
function removeTyping(){const i=document.getElementById('typingIndicator');if(i)i.remove()}
function saveChatHistory(){localStorage.setItem('pe_chat_history',JSON.stringify(chatHistory.slice(-50)))}
function clearChat(){chatHistory=[];localStorage.removeItem('pe_chat_history');document.getElementById('chatContainer').innerHTML='';addMessage('system','Chat dihapus. Mulai percakapan baru!');toggleSettings()}
loadSettings();
</script>
</body>
</html>
